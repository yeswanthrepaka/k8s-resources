apiVersion: v1
kind: PersistentVolume

metadata:
  name: ebs-static
  labels:
    project: roboshop

spec:
  accessModes: 
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-050549ff45ed30f3f

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: ebs-static-pvc 
  labels:
    project: roboshop

spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: "" #if not giving then it will take default
  resources:
    requests:
      storage: 2Gi
  volumeName: ebs-static

---
apiVersion: v1
kind: Pod

metadata:
  name: app
  labels:
    project: roboshop 

spec:
  volumes:
  - name: html-data
    persistentVolumeClaim:
      claimName: ebs-static-pvc
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: html-data
      mountPath: /usr/share/nginx/html
    nodeSelector:
      topology.kubernetes.io/zone: us-east-1f

