apiVersion: v1
kind: PersistentVolumeClaim 

metadata:
  name: efs-dynamic-pvc

spec:
  accessModes:
  - ReadWriteMany
  storageClassName: "roboshop-efs"
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Pod

metadata:
  name: app

spec:
  volumes:
  - name: nginx-data
    persistentVolumeClaim:
      claimName: efs-dynamic-pvc
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-data
      mountPath: /usr/share/nginx/html
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1f