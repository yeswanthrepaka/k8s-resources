apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: ebs-dynamic-pvc 
  labels:
    project: roboshop

spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: "roboshop-ebs"
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: Pod

metadata:
  name: app
  labels:
    project: roboshop
  
spec:
  volumes:
  - name: html-data
    persistentVolumeClaim:
      claimName: ebs-dynamic-pvc
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: html-data
      mountPath: /usr/share/nginx/html
    nodeSelector:
      topology.kubernetes.io/zone: us-east-1d