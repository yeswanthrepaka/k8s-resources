apiVersion: v1
kind: PersistentVolume

metadata:
  name: efs-static-pv

spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-12345678

---
apiVersion: v1
kind: PersistentVolumeClaim 

metadata:
  name: efs-static-pvc

spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
  volumeName: efs-static-pv

---
apiVersion: v1
kind: Pod

metadata:
  name: app

spec:
  volumes:
  - name: nginx-data
    persistentVolumeClaim:
      claimName: efs-static-pvc
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-data
      mountPath: /usr/share/nginx/html
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1f