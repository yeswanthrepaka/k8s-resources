apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx
  labels: 
    project: roboshop
    tier: frontend
    component: frontend
  annotations:
    kubernetes.io/change-cause: "nginx latest image"

spec: 
  replicas: 4
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend

  template:
    metadata:
      labels: 
        project: roboshop
        tier: frontend
        component: frontend
    spec:
      containers:
      - name: nginx
        image: nginx